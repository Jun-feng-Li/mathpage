    a {

    }

    ul {
      padding-left: 24px;
    }

    .publication {
      margin-bottom: 22px;
    }

    .publication-title {
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #777;
      font-size: 14px;
    }

</head>
